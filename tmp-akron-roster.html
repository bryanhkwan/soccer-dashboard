ioFields":15,"settings":15,"statsSeasons":15,"applyCustomFormatting":120,"call_to_action":2913},9564,3012,10051,"Sara","Bower","Cincinnati, Ohio","St. Ursula",{"Twitter":15,"Instagram":15,"Facebook":15,"YouTube":15,"Snapchat":15,"TikTok":15,"Cameo":15,"Twitch":15,"LinkedIn":15,"Shop":15},[2895,2896,2897,2898,2899,2900,2901,2902,2903,2904],{"platformName":480,"userName":15,"url":15,"icon":482,"oldIcon":2177},{"platformName":467,"userName":15,"url":15,"icon":470,"oldIcon":2179},{"platformName":474,"userName":15,"url":15,"icon":476,"oldIcon":2181},{"platformName":2183,"userName":15,"url":15,"icon":488,"oldIcon":2184},{"platformName":2186,"userName":15,"url":15,"icon":2187,"oldIcon":2188},{"platformName":2190,"userName":15,"url":15,"icon":2191,"oldIcon":2192},{"platformName":2194,"userName":15,"url":15,"icon":2195,"oldIcon":2196},{"platformName":2198,"userName":15,"url":15,"icon":2199,"oldIcon":2200},{"platformName":2202,"userName":15,"url":15,"icon":2203,"oldIcon":2204},{"platformName":2011,"userName":15,"url":15,"icon":2206,"oldIcon":2207},"33","Cincinnati United Premier GA",{"mediaCaption":15,"url":2908,"absoluteUrl":2909,"altText":2910,"title":2910,"creditName":15},"/images/2025/8/6/sara_bower-WSOC-HS25_SXFkp.jpg","https://gozips.com/images/2025/8/6/sara_bower-WSOC-HS25_SXFkp.jpg","Sara Bower WSOC-HS25",{"abbrev":279,"shortDisplay":279,"shortName":281,"globalSportId":221,"globalSportNameSlug":282,"globalSportGender":241,"id":283,"title":115},"2025-08-06T14:10:13.503","/sports/womens-soccer/roster/sara-bower/10051",[2915,2944,2968],{"bio":2916,"twitter":21,"image":2917,"images":15,"displayFields":2921,"sport":2925,"latestCoachBioId":226,"latestSupportBioId":15,"latestBioId":226,"id":2926,"title":2927,"firstName":2928,"lastName":2929,"email":2930,"phone":2931,"url":15,"staffId":2932,"socialMediaR":2933,"custom1":21,"custom2":21,"custom3":21,"custom4":21},"\u003Cstrong>Maggie Kuhn\u003C/strong> was named head coach of The University of Akron women's soccer program, Director of Athletics \u003Cstrong>Dr. Andrew T. Goodrich\u003C/strong> announced.\u003Cbr />\r\n \u003Cbr />\r\n\"Coach Kuhn has the ability and drive to help our student-athletes become champions on the field, in the classroom, and in our community,\" said Goodrich. \"I'm excited to see her work with her staff and players to develop passionate, humble, and hard-working leaders that best represent The University of Akron in pursuit of their championship aspirations.\"\u003Cbr />\r\n \u003Cbr />\r\n\"Coach Kuhn has been a steady and trusted presence for our student-athletes,\" said Senior Associate Director of Athletics/Senior Woman Administrator \u003Cstrong>Jackie Wallgren\u003C/strong>. \"She creates an environment where they feel supported, challenged, and valued, and her commitment to their development is evident in every interaction. Her leadership reflects the values of our department, and we're excited to see this program continue to grow under her guidance.\"\u003Cbr />\r\n\u003Cbr />\r\nKuhn served as the Interim Head Coach for the Zips during the 2025 campaign and will enter her fifth season overall with Akron program in 2026.\u003Cbr />\r\n\u003Cbr />\r\n\"I am both humbled and honored for the opportunity to continue to serve our dedicated and hard-working women,\" said Kuhn. \"Our student athletes make me incredibly proud every day and I could not be more excited to continue to watch our women and program grow. I would like to thank President Nemer, Dr. Juravich, Dr. Goodrich and Jackie Wallgren for their belief, confidence, and support. It also is not lost on me that I would not be in this position without the tireless work of Josh Kay and Nate Rausch, our student-athletes, our entire support staff, Sean Palchick, and everyone I have had the opportunity to learn from both past and present.\"\u003Cbr />\r\n\u003Cbr />\r\nKuhn boasts nearly 20 years of college coaching experience, including 10 seasons as a head coach at both Lock Haven University and Point Park University.\u003Cbr />\r\n \u003Cbr />\r\nThis past season, Kuhn guided Akron to its highest Mid-American Conference finish since the 2020 campaign on the strength nine league points, including the Zips earning three road results, its best mark since 2019. Additionally, the Zips posted their highest single-season goal (18) and point (62) totals since 2022 and 2018, respectively, while recording a program record 26 assists.\u003Cbr />\r\n \u003Cbr />\r\nAkron garnered a pair of All-MAC performers in senior \u003Cstrong>Emma King\u003C/strong> and freshman \u003Cstrong>Addison Hall\u003C/strong>, marking the most Zips honored since 2022.\u003Cbr />\r\n \u003Cbr />\r\nAkron continued to excel off the pitch under Kuhn as 12 earned Academic All-MAC honors this fall to go along with six Zips being recognized on the College Sports Communicators Academic All-District squad. Akron women's soccer recorded a program-record 3.814 GPA during the Spring 2025 semester and has led the department in cumulative team GPA for five consecutive semesters. \u003Cbr />\r\n \u003Cbr />\r\nKuhn spent three years (2019-21) leading the Lock Haven program where she mentored multiple all-conference performers, including Marah Foltz and Hunter McClellan.\u003Cbr />\r\n \u003Cbr />\r\nShe arrived at Lock Haven from Point Park University (NAIA) in downtown Pittsburgh, Pa., where she has served as the head coach for seven seasons.\u003Cbr />\r\n \u003Cbr />\r\nAt Point Park, she led the program to a 68-60-9 record, including a 37-12-3 conference record and her teams qualified for the conference tournament during every season. The team won 11 games in 2018 on the way to a regular season conference title. The 11 wins served as the second most wins in school history. Kuhn's 2015 team won a single-season school record 12 games.\u003Cbr />\r\n \u003Cbr />\r\nUnder Kuhn's guidance, Point Park won back-to-back conference titles in 2015 and 2016, and the Pioneers qualified for the NAIA national tournament in each of those two seasons.\u003Cbr />\r\n \u003Cbr />\r\nKuhn also brings with her extensive club and camp coaching experience and has been involved in the Olympic Development Program in Pennsylvania and West Virginia. She also served as an assistant coach with the Steel City F.C., a women's soccer team that plays in the Women's Premier Soccer League (WPSL).\u003Cbr />\r\n \u003Cbr />\r\nAs a player at Bethany College, Kuhn was a four-year starter at goalkeeper. In 2004, she earned the Player's Choice Award, was named the Team MVP and she earned a spot on the President's Athletic Conference First Team. In 2012, she was inducted into the Bethany College Alumni Soccer Association Star of Honor Society.\u003Cbr />\r\n \u003Cbr />\r\nA native of Western Pennsylvania, Kuhn graduated from Bethany College in 2004 with a degree in psychology and she earned a master's degree in education/teaching from Bethany College in 2012.",{"mediaCaption":15,"url":2918,"absoluteUrl":2919,"altText":2920,"title":2920,"creditName":15},"/images/2025/8/6/maggie_kuhn-WSOC-HS25_ahVgQ.jpg","https://gozips.com/images/2025/8/6/maggie_kuhn-WSOC-HS25_ahVgQ.jpg","Maggie Kuhn WSOC-HS25",{"staff_title":2922,"staff_email":2923,"staff_phone":2924},"Title","Email","Phone",{"abbrev":279,"shortDisplay":279,"shortName":281,"globalSportId":221,"globalSportNameSlug":282,"globalSportGender":241,"id":283,"title":115},1216,"Head Coach","Maggie","Kuhn","womenssoccer@uakron.edu","(330) 972-7651 ",536,[2934,2935,2936,2937,2938,2939,2940,2941,2942,2943],{"platformName":480,"userName":15,"url":15,"icon":482,"oldIcon":2177},{"platformName":467,"userName":15,"url":15,"icon":470,"oldIcon":2179},{"platformName":474,"userName":15,"url":15,"icon":476,"oldIcon":2181},{"platformName":2183,"userName":15,"url":15,"icon":488,"oldIcon":2184},{"platformName":2186,"userName":15,"url":15,"icon":2187,"oldIcon":2188},{"platformName":2190,"userName":15,"url":15,"icon":2191,"oldIcon":2192},{"platformName":2194,"userName":15,"url":15,"icon":2195,"oldIcon":2196},{"platformName":2198,"userName":15,"url":15,"icon":2199,"oldIcon":2200},{"platformName":2202,"userName":15,"url":15,"icon":2203,"oldIcon":2204},{"platformName":2011,"userName":15,"url":15,"icon":2206,"oldIcon":2207},{"bio":2945,"twitter":21,"image":2946,"images":15,"displayFields":2950,"sport":2951,"latestCoachBioId":203,"latestSupportBioId":15,"latestBioId":203,"id":2952,"title":2953,"firstName":2954,"lastName":2955,"email":2930,"phone":2931,"url":15,"staffId":2956,"socialMediaR":2957,"custom1":21,"custom2":21,"custom3":21,"custom4":21},"\u003Cp>Josh Kay is in his fourth season on the Zips’ coaching staff in 2025 after spending two seasons at Case Western Reserve University.\u003Cbr />\r\n\u003Cbr />\r\nThe United Soccer Coaches honored Kay as a member of its 30 Under 30 Class for the 2023-24 campaign. The 30 Under 30 Program is a year-long education and mentorship opportunity for select coaches who are leading the way in developing soccer players and enhancing the game.\u003Cbr />\r\n \u003Cbr />\r\nKay, who joined the Case Western Reserve staff in the spring of 2020, helped guide the Spartans to new heights in 2021 when the coaching staff received D3Soccer.com Division III National Coaching Staff of the Year, United Soccer Coaches NCAA Division III Region VII Coaching Staff of the Year, and UAA Coaching Staff of the Year honors. The Spartans qualified for the NCAA Division III Championship and reached the round of 16 for the first time in program history.\u003Cbr />\r\n \u003Cbr />\r\nPrior to Case Western Reserve, Kay had gained extensive experience coaching at different levels including: recreation, travel, club, high school, college club, and ODP.\u003Cbr />\r\n\u003Cbr />\r\nA native of Akron, Ohio, Kay graduated from the University of Akron in 2018 with a bachelor’s degree in sport management and coaching education. He is pursuing an MBA from the University of Akron and will earn his master's degree in the Spring of 2026.\u003Cbr />\r\n \u003Cbr />\r\nCurrently, Kay serves as a coach for the Internationals Soccer Club and holds the USSF National \"C\" Coaching License. \u003C/p>\r\n",{"mediaCaption":15,"url":2947,"absoluteUrl":2948,"altText":2949,"title":2949,"creditName":15},"/images/2025/8/6/josh_kay-WSOC-HS25_VUaKS.jpg","https://gozips.com/images/2025/8/6/josh_kay-WSOC-HS25_VUaKS.jpg","Josh Kay WSOC-HS25",{"staff_title":2922,"staff_email":2923,"staff_phone":2924},{"abbrev":279,"shortDisplay":279,"shortName":281,"globalSportId":221,"globalSportNameSlug":282,"globalSportGender":241,"id":283,"title":115},1217,"Assistant Soccer Coach","Josh ","Kay",537,[2958,2959,2960,2961,2962,2963,2964,2965,2966,2967],{"platformName":480,"userName":15,"url":15,"icon":482,"oldIcon":2177},{"platformName":467,"userName":15,"url":15,"icon":470,"oldIcon":2179},{"platformName":474,"userName":15,"url":15,"icon":476,"oldIcon":2181},{"platformName":2183,"userName":15,"url":15,"icon":488,"oldIcon":2184},{"platformName":2186,"userName":15,"url":15,"icon":2187,"oldIcon":2188},{"platformName":2190,"userName":15,"url":15,"icon":2191,"oldIcon":2192},{"platformName":2194,"userName":15,"url":15,"icon":2195,"oldIcon":2196},{"platformName":2198,"userName":15,"url":15,"icon":2199,"oldIcon":2200},{"platformName":2202,"userName":15,"url":15,"icon":2203,"oldIcon":2204},{"platformName":2011,"userName":15,"url":15,"icon":2206,"oldIcon":2207},{"bio":2969,"twitter":21,"image":2970,"images":15,"displayFields":2974,"sport":2976,"latestCoachBioId":267,"latestSupportBioId":15,"latestBioId":267,"id":2977,"title":2953,"firstName":2978,"lastName":2979,"email":2930,"phone":2931,"url":15,"staffId":2980,"socialMediaR":2981,"custom1":21,"custom2":21,"custom3":21,"custom4":21},"Nate Rausch is in his first season on the Zips’ coaching staff in 2025 after serving as head women’s soccer coach at Bethany College.\u003Cbr />\r\n \u003Cbr />\r\nRausch joined Bethany College in January after serving as an assistant coach for seven seasons (2018-24) at Thomas More University.\u003Cbr />\r\n \u003Cbr />\r\nPrior to Bethany College, he spent four years (2020-24) as the director of goalkeeping at the Ohio Elite Soccer Academy after mentoring goalkeepers at Hiram College (2014-18) as the volunteer assistant goalkeeper coach.\u003Cbr />\r\n \u003Cbr />\r\nA four-year starter in goal at Hiram College, Rausch garnered First-Team All-Region and All-Conference accolades en route to becoming the program’s all-time leader in shutouts (14), while ranking fourth in career saves (284) and posting a 39-23-7 record in net. Additionally, he played one year professionally indoors with the Ohio Vortex in the Premier Arena Soccer League.\u003Cbr />\r\n \u003Cbr />\r\nA native of Cuyahoga Falls, Ohio, Rausch graduated from the University of Akron in 2016 with a bachelor’s degree in multidisciplinary studies. He then earned a master’s degree in ethical leadership from Thomas More University in 2020.\u003Cbr />\r\n \u003Cbr />\r\nCurrently, Rausch holds the USSF National \"D\" coaching license and goalkeeper 1 and 2 diplomas. \u003Cbr />\r\n ",{"mediaCaption":15,"url":2971,"absoluteUrl":2972,"altText":2973,"title":2973,"creditName":15},"/images/2025/8/6/nate_rausch-WSOC-HS25_ESoX6.jpg","https://gozips.com/images/2025/8/6/nate_rausch-WSOC-HS25_ESoX6.jpg","Nate Rausch WSOC-HS25",{"staff_title":2922,"staff_email":2923,"staff_phone":2924,"staff_custom_1":2975},"Alma Mater",{"abbrev":279,"shortDisplay":279,"shortName":281,"globalSportId":221,"globalSportNameSlug":282,"globalSportGender":241,"id":283,"title":115},1259,"Nate","Rausch",676,[2982,2983,2984,2985,2986,2987,2988,2989,2990,2991],{"platformName":480,"userName":15,"url":15,"icon":482,"oldIcon":2177},{"platformName":467,"userName":15,"url":15,"icon":470,"oldIcon":2179},{"platformName":474,"userName":15,"url":15,"icon":476,"oldIcon":2181},{"platformName":2183,"userName":15,"url":15,"icon":488,"oldIcon":2184},{"platformName":2186,"userName":15,"url":15,"icon":2187,"oldIcon":2188},{"p
